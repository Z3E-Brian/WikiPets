# Development profile: verbose SQL and connection pool logs.
# Activate with --spring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev.
# Never enable it in production: TRACE on BasicBinder prints the values bound to queries.
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.datasource.DriverManagerDataSource=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
